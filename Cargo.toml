[package]
name = "larma-mic"
version = "0.5.0"
edition = "2021"
description = "Use a phone (iPhone or Android) as a PC microphone: audio over Wi-Fi, USB or Bluetooth tethering, RNNoise noise removal, output to a virtual mic (VB-Cable or Steam)"

[dependencies]
eframe = "0.31"
cpal = "0.15"
nnnoiseless = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
local-ip-address = "0.6"
tray-icon = "0.27.0"
global-hotkey = "0.10.0"
getrandom = "0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
